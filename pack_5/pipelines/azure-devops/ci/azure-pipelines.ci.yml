trigger:
  branches:
    include:
      - main

pr: none

jobs:
  - job: CI
    displayName: Continuous Integration
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - template: pipelines/azure-devops/templates/steps/docs-check.yml

      - template: pipelines/azure-devops/templates/steps/secret-scan.yml

      - template: pipelines/azure-devops/templates/steps/validate-eval-datasets.yml

      - template: pipelines/azure-devops/templates/steps/python-check.yml

      - template: pipelines/azure-devops/templates/steps/eval-sample.yml

      - task: PublishPipelineArtifact@1
        displayName: Publish evaluation reports
        condition: always()
        inputs:
          targetPath: eval/reports
          artifact: eval-reports
