steps:
  - bash: |
      set -euo pipefail

      echo "Running lightweight secret scan."

      if command -v gitleaks >/dev/null 2>&1; then
        gitleaks detect --source . --redact --no-git --verbose
      else
        echo "##vso[task.logissue type=warning]gitleaks is not installed. Using lightweight fallback scan."

        if grep -RInE "(-----BEGIN .*PRIVATE KEY-----|AccountKey=|ClientSecret=|password\s*=\s*['\"][^'\"]+|secret\s*=\s*['\"][^'\"]+)" \
          --exclude-dir=.git \
          --exclude-dir=.terraform \
          .; then
          echo "Potential secret pattern detected."
          exit 1
        fi

        echo "No obvious secret patterns detected."
      fi
    displayName: Secret scan
